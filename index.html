<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12151c" />
    <title>Robot Explorer</title>
  </head>

  <body>
    <main id="viewport" data-i18n-aria="viewportAria" aria-label="Interactive 3D robot explorer"></main>

    <header class="panel title-panel">
      <h1 data-i18n="title">Robot Explorer</h1>
      <p data-i18n="subtitle">Reachy Mini + Microduck</p>
      <span class="badge" data-i18n="badge">OFFICIAL CAD MESHES</span>
    </header>

    <aside class="panel inspector">
      <span class="eyebrow" data-i18n="inspectorEyebrow">PART INSPECTOR</span>
      <h2 id="part-name" data-i18n="hoverPrompt">Hover over a robot</h2>

      <dl>
        <dt data-i18n="robot">Robot</dt>
        <dd id="robot-name">—</dd>

        <dt data-i18n="parentJoint">Parent joint</dt>
        <dd id="joint-name">—</dd>

        <dt data-i18n="jointType">Joint type</dt>
        <dd id="joint-type">—</dd>
      </dl>

      <p class="hint" data-i18n="hint">Hover or tap a part to inspect it.</p>
    </aside>

    <aside id="tutorial" class="panel tutorial-panel" hidden>
      <div class="tutorial-head">
        <span class="eyebrow" data-i18n="lessonEyebrow">LESSON</span>
        <span id="tutorial-step">1 / 6</span>
      </div>
      <h2 id="tutorial-title" data-i18n="lesson">Lesson</h2>
      <div id="tutorial-body" class="tutorial-body"></div>
      <div id="tutorial-sliders" class="tutorial-sliders"></div>
      <div id="tutorial-presets" class="tutorial-presets"></div>
      <p id="tutorial-challenge" class="tutorial-challenge" hidden></p>
      <div id="tutorial-gait" class="tutorial-gait" hidden>
        <p id="tutorial-phase" class="tutorial-phase" data-i18n="phaseEllipsis">Phase…</p>
      </div>
      <div class="tutorial-nav">
        <button id="tutorial-prev" type="button" data-i18n="prev">Prev</button>
        <a id="tutorial-notes" class="tutorial-notes" href="/notes/index.md" target="_blank" rel="noopener" data-i18n="learnMore">Learn more</a>
        <button id="tutorial-next" type="button" data-i18n="next">Next</button>
      </div>
    </aside>

    <footer class="panel controls">
      <span data-i18n="orbitHint">Drag to orbit · Scroll to zoom</span>
      <button id="lang-toggle" type="button" title="English / Español">ES</button>
      <button id="tutorial-toggle" type="button" aria-pressed="false">Tutorial</button>
      <button id="physics-toggle" type="button" aria-pressed="false">Physics</button>
      <button id="play-pause" type="button" aria-pressed="true">Pause</button>
      <button id="reset" type="button" data-i18n="resetView">Reset view</button>
    </footer>

    <div id="status" role="status" data-i18n="loading">Loading robot models…</div>

    <script>
      // Keep errors visible even if the main module fails to import.
      window.showRobotError = (error) => {
        const status = document.getElementById("status");
        status.hidden = false;
        status.classList.add("error");
        const prefix =
          document.documentElement.lang === "es"
            ? "No se pudo iniciar la escena 3D: "
            : "Unable to start the 3D scene: ";
        status.textContent =
          prefix +
          (error?.message || String(error)) +
          "\nCheck the browser console for details.";
      };

      window.addEventListener("error", (event) => {
        window.showRobotError(event.error || event.message);
      });

      window.addEventListener("unhandledrejection", (event) => {
        window.showRobotError(event.reason);
      });
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
